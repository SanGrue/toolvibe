<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- 终端窗口外框 (圆角矩形) -->
  <rect x="4" y="6" width="40" height="36" rx="4" ry="4" stroke="#1e1e2e" stroke-width="3" fill="none"/>
  <!-- 顶部标题栏分隔线 -->
  <line x1="4" y1="14" x2="44" y2="14" stroke="#1e1e2e" stroke-width="2.5"/>
  <!-- 标题栏三个小圆点 -->
  <circle cx="11" cy="10" r="1.8" fill="#ef4444"/>
  <circle cx="17" cy="10" r="1.8" fill="#f59e0b"/>
  <circle cx="23" cy="10" r="1.8" fill="#22c55e"/>
  <!-- VIBE 心跳脉冲线 (直线 + 弧线组合) -->
  <polyline 
    points="8,30 15,30 18,30 20,36 23,20 26,33 29,27 32,30 40,30" 
    stroke="#3b82f6" 
    stroke-width="2.8" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none"/>
</svg>