name: Auto Build Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 下载您的代码仓库
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 安装并配置 Node.js 环境
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x' # 适配现代 Vite/Vue 的 Node.js 版本
        cache: 'npm'

    # 3. 安装依赖包
    - name: Install dependencies
      run: npm ci

    # 4. 执行 Vite 的打包命令
    - name: Build project
      run: npm run build

    # 5. 可选：将打包生成的 dist 文件夹作为“产物（Artifact）”保存并提供下载
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vue-dist-folder
        path: dist/
        retention-days: 7
